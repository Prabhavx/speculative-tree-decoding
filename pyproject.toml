[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-tree-decoding"
version = "0.1.0"
description = "A research-oriented implementation of chain and tree speculative decoding for LLM inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "inference", "speculative-decoding", "transformers", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "matplotlib>=3.8.0",
]
demo = [
    "streamlit>=1.35.0",
    "graphviz>=0.20.0",
    "plotly>=5.20.0",
]

[project.scripts]
speculative-tree-decode = "speculative_tree_decoding.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["speculative_tree_decoding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
